name: test

# Per-arc regression gate (arc T1-A). Runs the fast check on every push to the
# working branches and on every PR: pFUnit unit suite + 4 byte-identical
# regression cases (hupselbrook, soilhysteresis, snow, swcf3) whose inputs come
# from the pinned SWAP-model/swap-testcases checkout. This is the same
# `pixi run -e test check-fast` that CLAUDE.md requires GREEN before every commit
# — now enforced in CI, not only locally. The release pipeline stays in ci.yaml
# (tag-triggered); this workflow does not build or release.

on:
  push:
    branches: [development, main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch/PR cancels an in-flight run.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Regression case *inputs* live in the standalone public
      # SWAP-model/swap-testcases repo (the expected-output fixtures stay here).
      # Pin to the tag recorded in TESTCASES_REF — a release tag, never a bare
      # commit: an earlier submodule broke when its pinned commit was GC'd
      # upstream. Bumping the pin is an ordinary reviewed change to that file.
      - name: Read swap-testcases pin
        id: testcases
        run: echo "ref=$(cat TESTCASES_REF)" >> "$GITHUB_OUTPUT"

      - name: Check out swap-testcases (pinned)
        uses: actions/checkout@v4
        with:
          repository: SWAP-model/swap-testcases
          ref: ${{ steps.testcases.outputs.ref }}
          path: swap-testcases

      # The in-repo tests/regression/cases mirror (read by the pFUnit suite via
      # hardcoded paths) must stay identical to the pinned canonical tag, or the
      # two consumers silently diverge. Fail loudly on any input drift. observed/
      # data lives only in the canonical repo; run artifacts are never committed.
      - name: Assert in-repo cases mirror the pinned tag
        run: |
          diff -r \
            --exclude=observed --exclude=__pycache__ \
            --exclude=result_output.csv --exclude='result_*.csv' \
            --exclude=Swap.ok --exclude='*.log' \
            tests/regression/cases swap-testcases/cases
          echo "in-repo cases match swap-testcases ${{ steps.testcases.outputs.ref }}"

      # gfortran is the only supported compiler (ADR 0001); ubuntu-latest ships
      # it preinstalled. pixi provides meson + cmake + the Python test deps.
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.70.2
          cache: true

      # pFUnit is built from source (not on conda/PyPI) into tests/pFUnit/build,
      # which is git-ignored. Cache it so we don't rebuild v4.15.0 every run;
      # the key tracks the provisioning script.
      - name: Cache pFUnit build
        uses: actions/cache@v4
        with:
          path: tests/pFUnit/build
          key: pfunit-v4.15.0-${{ runner.os }}-${{ hashFiles('scripts/setup_pfunit.sh') }}

      # check-fast depends-on build-linux (→ setup-pfunit → configure → compile)
      # and test-pfunit, so this one command bootstraps pFUnit, builds SWAP, runs
      # the unit suite, then the 4 regression cases. Byte-identical is the gate.
      - name: check-fast (pFUnit + byte-identical regression)
        env:
          # Point the Python regression runner at the pinned swap-testcases
          # checkout, so CI dogfoods the canonical case repo. (The pFUnit suite
          # still reads the in-repo cases mirror via hardcoded paths; the two
          # are kept identical — the mirror tracks the pinned tag.)
          SWAP_TESTCASES_PATH: ${{ github.workspace }}/swap-testcases/cases
        run: pixi run -e test check-fast
