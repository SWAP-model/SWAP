test-unit-heat = { cmd = 'bash -lc "[ -z \"$ONEAPI_ROOT\" ] && source /opt/intel/oneapi/setvars.sh; meson test -C builddir --no-rebuild --print-errorlogs test_heat_state"', depends-on = ["build-linux"] }
test-unit-macropore = { cmd = 'bash -lc "[ -z \"$ONEAPI_ROOT\" ] && source /opt/intel/oneapi/setvars.sh; meson test -C builddir --no-rebuild --print-errorlogs test_macropore_state"', depends-on = ["build-linux"] }
