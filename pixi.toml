test-unit-tillage = { cmd = 'bash -lc "[ -z \"$ONEAPI_ROOT\" ] && source /opt/intel/oneapi/setvars.sh; meson test -C builddir --no-rebuild --print-errorlogs test_tillage_state"', depends-on = ["build-linux"] }
