[pytest]
# Python test harnesses (byte-identical regression + the C-ABI binding/coupling
# smokes). The pFUnit Fortran unit suite is separate (meson: unit-pfunit).
testpaths =
    tests/regression
    tests/bmi
    tests/cffi-demo
    tests/coupling
# Keep collection off the vendored pFUnit checkout and the non-test coupling
# support packages/fixtures.
norecursedirs =
    tests/pFUnit
    builddir*
    .pixi
    tests/coupling/imod_coupler_fork
    tests/coupling/hupselbrook_coupled
markers =
    fast: quick, high-signal regression cases (the check-fast subset)
addopts = -ra
