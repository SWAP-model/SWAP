[workspace]
authors = ["zawadzkim <zawadzkimat@outlook.com>"]
channels = ["conda-forge"]
name = "swap"
platforms = ["linux-64", "win-64"]
version = "4.2.0"

[activation]
env = { PFUNIT_ROOT = "$PIXI_PROJECT_ROOT/tests/pFUnit/build/install_gfortran/PFUNIT-4.15" }

[tasks]
build-linux = 'bash -c "source /opt/intel/oneapi/setvars.sh && FC=ifx meson setup builddir && meson compile -C builddir"'
build-windows-cross = "meson setup builddir_windows --cross-file cross_mingw.txt && meson compile -C builddir_windows"
build-windows-native = "FC=ifx meson setup builddir_windows_native && meson compile -C builddir_windows_native"
clean = "rm -rf builddir builddir_windows builddir_windows_native"

test-linux-hupselbrook = { cmd = "cd tests/cases/1.hupselbrook && cp swap_linux.swp.template swap.swp && ./run_swap.sh" }
test-linux-grassgrowth = { cmd = "cd tests/cases/2.grassgrowth && cp swap_linux.swp.template swap.swp && ./run_swap.sh" }
test-linux-macropore = { cmd = "cd tests/cases/3.macroporeflow && cp swap_linux.swp.template swap.swp && ./run_swap.sh" }
test-linux-oxygenstress = { cmd = "cd tests/cases/4.oxygenstress && cp swap_linux.swp.template swap.swp && ./run_swap.sh" }
test-linux-salinitystress = { cmd = "cd tests/cases/5.salinitystress && cp swap_linux.swp.template swap.swp && ./run_swap.sh" }
test-linux-surfacewater = { cmd = "cd tests/cases/6.surfacewater && cp swap_linux.swp.template swap.swp && ./run_swap.sh" }

test-windows-hupselbrook = { cmd = "cd tests/cases/1.hupselbrook && cp swap_windows.swp.template swap.swp && run_swap.cmd" }
test-windows-grassgrowth = { cmd = "cd tests/cases/2.grassgrowth && cp swap_windows.swp.template swap.swp && run_swap.cmd" }
test-windows-macropore = { cmd = "cd tests/cases/3.macroporeflow && cp swap_windows.swp.template swap.swp && run_swap.cmd" }
test-windows-oxygenstress = { cmd = "cd tests/cases/4.oxygenstress && cp swap_windows.swp.template swap.swp && run_swap.cmd" }
test-windows-salinitystress = { cmd = "cd tests/cases/5.salinitystress && cp swap_windows.swp.template swap.swp && run_swap.cmd" }
test-windows-surfacewater = { cmd = "cd tests/cases/6.surfacewater && cp swap_windows.swp.template swap.swp && run_swap.cmd" }

test-linux = { cmd = "cd tests/cases/1.hupselbrook && cp swap_linux.swp.template swap.swp && ./run_swap.sh" }
test-windows = { cmd = "cd tests/cases/1.hupselbrook && cp swap_windows.swp.template swap.swp && run_swap.cmd" }

# Unit tests for state module refactoring
test-unit = { cmd = "./builddir/test_state && ./builddir/test_state_sync && ./builddir/test_soil_state && ./builddir/test_drainage_state && ./builddir/test_atmosphere_state && ./builddir/test_heat_state && ./builddir/test_macropore_state && ./builddir/test_solute_state && ./builddir/test_tillage_state", depends-on = ["build-linux"] }
test-unit-state = { cmd = "./builddir/test_state", depends-on = ["build-linux"] }
test-unit-sync = { cmd = "./builddir/test_state_sync", depends-on = ["build-linux"] }
test-unit-soil = { cmd = "./builddir/test_soil_state", depends-on = ["build-linux"] }
test-unit-drainage = { cmd = "./builddir/test_drainage_state", depends-on = ["build-linux"] }
test-unit-atmosphere = { cmd = "./builddir/test_atmosphere_state", depends-on = ["build-linux"] }
test-unit-heat = { cmd = "./builddir/test_heat_state", depends-on = ["build-linux"] }
test-unit-macropore = { cmd = "./builddir/test_macropore_state", depends-on = ["build-linux"] }
test-unit-solute = { cmd = "./builddir/test_solute_state", depends-on = ["build-linux"] }
test-unit-tillage = { cmd = "./builddir/test_tillage_state", depends-on = ["build-linux"] }

regression_hupselbrook = "python tests/regression/test_output_regression.py hupselbrook"
regression_macropore = "python tests/regression/test_output_regression.py macropore"
regression_grassgrowth = "python tests/regression/test_output_regression.py grassgrowth"
regression_oxygenstress = "python tests/regression/test_output_regression.py oxygenstress"
regression_salinitystress = "python tests/regression/test_output_regression.py salinitystress"
regression_surfacewater = "python tests/regression/test_output_regression.py surfacewater"
regression_all = "python tests/regression/test_output_regression.py"


[dependencies]
python = "3.11.*"
meson = "==1.7"