[workspace]
authors = ["zawadzkim <zawadzkimat@outlook.com>"]
channels = ["conda-forge"]
name = "swap"
platforms = ["linux-64", "win-64"]
version = "4.2.0"

[activation]
env = { PFUNIT_ROOT = "$PIXI_PROJECT_ROOT/tests/pFUnit/build/install_gfortran/PFUNIT-4.15" }

[dependencies]
python = "3.11.*"
meson = "==1.7"

[pypi-dependencies]
fprettify = ">=0.3.7, <0.4"
cffi = ">=1.16"

#============================================================================
# FEATURES - Modular dependency groups
#============================================================================

# ---- Testing Feature ----
[feature.test.dependencies]
python = "3.11.*"
pytest = ">=8.0"
pytest-xdist = ">=3.5"
pytest-timeout = ">=2.2"
pandas = "<3.0"
flopy = ">=3.5"
modflow6 = ">=6.4"
xmipy = ">=1.3"

[feature.test.pypi-dependencies]
pyswap = ">=0.3.9"
cffi = ">=1.16"

[feature.test.tasks]
# Main regression task with optional arguments
# Usage: 
#   pixi run -e test regression              # runs all cases
#   pixi run -e test regression hupselbrook  # runs single case
#   pixi run -e test regression --log-timing # runs all with timing
regression = { cmd = "python tests/regression/test_output_regression.py", depends-on = ["build-linux"] }

#============================================================================
# VERIFICATION GATES — the canonical commands for iteration and phase-end.
# check-fast: everyday iteration (build + pFUnit + four fast regression cases).
#             Budget: < 90s wall time.
# check-full: phase-end gate (build + pFUnit + all six cases).
#             Budget: ~10 minutes.
#============================================================================
check-fast = { cmd = "python tests/regression/test_output_regression.py hupselbrook surfacewater salinitystress grassgrowth", depends-on = ["build-linux", "test-pfunit"] }
check-full = { cmd = "python tests/regression/test_output_regression.py", depends-on = ["build-linux", "test-pfunit"] }

#============================================================================
# CFFI / BMI TEST TASKS — exercise the Python-callable C ABI.
#
# test-bmi      : SS-DRV Phase 1 hello-world — initialize / update / finalize
#                  via cffi + a couple of get_value_double calls.
# test-cffi-demo: SS-BMI2 Phase 2 end-to-end demo — in-memory TOML config,
#                  headless mode, swap_view_array zero-copy, water-balance
#                  struct readout. Hupselbrook case, ~30k update steps.
# test-xmi      : SWAP-only XMI contract smoke via xmipy (no MODFLOW) —
#                  loads libswap_xmi.so, exercises get_value_ptr on the three
#                  exchange arrays + a few coupled-style steps.
# test-coupling : full SWAP<->MODFLOW6 coupled smoke (short run, ncol=10/nper=30)
#                  via the vendored swapmod driver; needs libmf6.so (test env).
# test-all      : convenience — pFUnit + bmi + cffi-demo + the two coupling
#                  smokes + four-case regression.
#============================================================================
test-bmi       = { cmd = "meson test -C builddir --suite bmi --verbose", depends-on = ["build-linux"] }
test-cffi-demo = { cmd = "meson test -C builddir --suite cffi-demo --verbose", depends-on = ["build-linux"] }
test-xmi       = { cmd = "python tests/coupling/test_swap_xmi_smoke.py", depends-on = ["build-linux"] }
test-coupling  = { cmd = "python tests/coupling/test_coupled_smoke.py", depends-on = ["build-linux"] }
test-all       = { cmd = "python tests/regression/test_output_regression.py hupselbrook surfacewater salinitystress grassgrowth", depends-on = ["build-linux", "test-pfunit", "test-bmi", "test-cffi-demo", "test-xmi", "test-coupling"] }

# ---- Documentation Feature ----
[feature.docs.dependencies]
ford = ">=7.0"
python = "3.11.*"

[feature.docs.tasks]
# Generate FORD documentation
# Usage: pixi run -e docs docs-build
docs-build = "ford docs.md"
# Serve documentation locally
# Usage: pixi run -e docs docs-serve
docs-serve = { cmd = "python -m http.server --directory docs/api 8001", depends-on = ["docs-build"] }
# Open documentation in browser (Linux)
# Usage: pixi run -e docs docs-open
docs-open = { cmd = "xdg-open doc/index.html || open doc/index.html", depends-on = ["docs-build"] }
# Clean generated documentation
# Usage: pixi run -e docs docs-clean
docs-clean = "rm -rf doc api-doc"
# Full rebuild: clean and build
# Usage: pixi run -e docs docs-rebuild
docs-rebuild = { depends-on = ["docs-clean", "docs-build"] }

# ---- Coverage Feature ----
[feature.coverage.dependencies]
python = "3.11.*"
pandas = "<3.0"
pytest = ">=8.0"
pytest-xdist = ">=3.5"

[feature.coverage.pypi-dependencies]
gcovr = ">=7.0"
pyswap = ">=0.3.9"

[feature.coverage.tasks]
_configure-coverage = { cmd = "FC=gfortran meson setup builddir --reconfigure -Denable_coverage=true" }
build-coverage     = { cmd = "meson compile -C builddir", depends-on = ["_configure-coverage"] }
test-pfunit-cov    = { cmd = "meson test -C builddir --suite unit-pfunit --verbose", depends-on = ["build-coverage"] }
regression-cov     = { cmd = "python tests/regression/test_output_regression.py hupselbrook surfacewater salinitystress grassgrowth", depends-on = ["build-coverage"] }
coverage-run       = { depends-on = ["test-pfunit-cov", "regression-cov"] }
coverage-report    = { cmd = "mkdir -p builddir/coverage && gcovr --root . --filter 'src/' --gcov-ignore-errors=no_working_dir_found --gcov-ignore-parse-errors=suspicious_hits.warn_once_per_file --html-details builddir/coverage/index.html --txt --print-summary builddir", depends-on = ["coverage-run"] }

[environments]
default = { solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }
# solve-group "coverage" is separate because gcovr requires pygments>=2.13
# while ford (in the docs feature) pins pygments<2.13.
coverage = { features = ["coverage"], solve-group = "coverage" }


[tasks]
#============================================================================
# BUILD TASKS — single builddir/; pFUnit on by default (ADR 0002).
# Pass -Denable_pfunit=false to _reconfigure to build the swap binary only.
#
# _configure: only runs `meson setup` if builddir is missing. Ninja
#             handles incremental rebuilds; --reconfigure is only needed
#             when meson_options.txt or any meson.build changes.
# _reconfigure: forced setup --reconfigure. Use after changing build
#               configuration (e.g. `pixi run _reconfigure`).
#============================================================================
_configure = { cmd = "test -f builddir/build.ninja || FC=gfortran meson setup builddir" }
_reconfigure = { cmd = "FC=gfortran meson setup builddir --reconfigure" }
build-linux = { cmd = "meson compile -C builddir", depends-on = ["_configure"] }

build-windows-cross = "meson setup builddir_windows --cross-file cross_mingw.txt && meson compile -C builddir_windows"
clean = "rm -rf builddir builddir_windows builddir_windows_native builddir_gfortran"

#============================================================================
# RUN TASKS
#============================================================================
swap     = { cmd = "cd tests/swap-cases && ./run_case.sh --exec ../../builddir/swap", depends-on = ["build-linux"] }
swap-win = { cmd = "cd tests/swap-cases && ./run_case.cmd --exec ../../builddir_windows/swap.exe", depends-on = ["build-windows-cross"] }
swap-ref     = { cmd = "cd tests/swap-cases && ./run_case.sh --exec ../../tests/reference/swap420" }
swap-win-ref = { cmd = "cd tests/swap-cases && ./run_case.cmd --exec ../../tests/reference/swap.exe" }

# Format Fortran sources in place per .fprettify.rc.
lint = { cmd = "fprettify --config-file .fprettify.rc -r src tests/unit" }

# Dry-run: show what lint would change without writing.
lint-check = { cmd = "fprettify --config-file .fprettify.rc -d -r src tests/unit" }

#============================================================================
# UNIT TEST TASKS — pFUnit only; builds in the unified builddir.
# Returns exit 0 with "No suitable tests defined." if pf_files is empty
# (that is the baseline state; Phase 4 re-populates as state modules return).
#============================================================================
test-pfunit = { cmd = "meson test -C builddir --suite unit-pfunit --verbose", depends-on = ["build-linux"] }