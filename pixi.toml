[workspace]
authors = ["zawadzkim <zawadzkimat@outlook.com>"]
channels = ["conda-forge"]
name = "swap"
platforms = ["linux-64", "win-64"]
version = "4.2.0"

[activation]
env = { PFUNIT_ROOT = "$PIXI_PROJECT_ROOT/tests/pFUnit/build/install_gfortran/PFUNIT-4.15" }

[dependencies]
python = "3.11.*"
meson = "==1.7"

[pypi-dependencies]
fprettify = ">=0.3.7, <0.4"

#============================================================================
# FEATURES - Modular dependency groups
#============================================================================

# ---- Testing Feature ----
[feature.test.dependencies]
python = "3.11.*"
pytest = ">=8.0"
pytest-xdist = ">=3.5"
pytest-timeout = ">=2.2"
pandas = "<3.0"

[feature.test.pypi-dependencies]
pyswap = ">=0.3.9"

[feature.test.tasks]
# Main regression task with optional arguments
# Usage: 
#   pixi run -e test regression              # runs all cases
#   pixi run -e test regression hupselbrook  # runs single case
#   pixi run -e test regression --log-timing # runs all with timing
regression = { cmd = "python tests/regression/test_output_regression.py", depends-on = ["build-linux"] }

# ---- Documentation Feature ----
[feature.docs.dependencies]
ford = ">=7.0"
python = "3.11.*"

[feature.docs.tasks]
# Generate FORD documentation
# Usage: pixi run -e docs docs-build
docs-build = "ford docs.md"
# Serve documentation locally
# Usage: pixi run -e docs docs-serve
docs-serve = { cmd = "python -m http.server --directory docs/api 8001", depends-on = ["docs-build"] }
# Open documentation in browser (Linux)
# Usage: pixi run -e docs docs-open
docs-open = { cmd = "xdg-open doc/index.html || open doc/index.html", depends-on = ["docs-build"] }
# Clean generated documentation
# Usage: pixi run -e docs docs-clean
docs-clean = "rm -rf doc api-doc"
# Full rebuild: clean and build
# Usage: pixi run -e docs docs-rebuild
docs-rebuild = { depends-on = ["docs-clean", "docs-build"] }

[environments]
default = { solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }


[tasks]
#============================================================================
# BUILD TASKS
#============================================================================
build-linux = 'bash -c "[ -z \"$ONEAPI_ROOT\" ] && source /opt/intel/oneapi/setvars.sh; FC=ifx meson setup builddir --reconfigure -Denable_pfunit=false && meson compile -C builddir"'
build-windows-cross = "meson setup builddir_windows --cross-file cross_mingw.txt && meson compile -C builddir_windows"
clean = "rm -rf builddir builddir_windows builddir_windows_native"

#============================================================================
# RUN TASKS - Using run_swap.sh script
#============================================================================
# Run test cases with newly built executable (builddir/swap)
# These tasks are for development. The builddir directory has to be created with one of the build tasks. In case you want to run
# the cases with the reference executable, then please create a swap_org directory in the root of the project and unzip the contents of the
# file downloaded from the official repository of WUR containing SWAP 4.2.0 source code and executables. This might change in the future.
# Usage: pixi run run-swap --case <case_name> [--keep-csv]
# Usage: pixi run run-swap -c <case_name> [-k]
# Example: pixi run swap hupselbrook
swap = { cmd = "cd tests/swap-cases && ./run_case.sh --exec ../../builddir/swap", depends-on = ["build-linux"] }
swap-win = { cmd = "cd tests/swap-cases && ./run_case.cmd --exec ../../builddir_windows/swap.exe", depends-on = ["build-windows-cross"] }

# Run test cases with original/system executable
# Usage: pixi run run-swap-original <case_name> [executable_path] [--keep-csv]
# Example: pixi run run-swap-original hupselbrook ./swap_original
swap-ref = { cmd = "cd tests/swap-cases && ./run_case.sh --exec /home/zawadzkim/Code/swap/swap_org/linux/swap420" }
swap-win-ref = { cmd = "cd tests/swap-cases && ./run_case.cmd --exec ../../builddir_windows/swap.exe", depends-on = ["build-windows-cross"] }

lint = { cmd = "fprettify" }

# Unit tests for state module refactoring
test-unit = { cmd = 'bash -lc "[ -z \"$ONEAPI_ROOT\" ] && source /opt/intel/oneapi/setvars.sh; meson test -C builddir --no-rebuild --suite unit-standalone --print-errorlogs"', depends-on = ["build-linux"] }
test-unit-state = { cmd = 'bash -lc "[ -z \"$ONEAPI_ROOT\" ] && source /opt/intel/oneapi/setvars.sh; meson test -C builddir --no-rebuild --print-errorlogs test_state"', depends-on = ["build-linux"] }
test-unit-sync = { cmd = 'bash -lc "[ -z \"$ONEAPI_ROOT\" ] && source /opt/intel/oneapi/setvars.sh; meson test -C builddir --no-rebuild --print-errorlogs test_state_sync"', depends-on = ["build-linux"] }
test-unit-soil = { cmd = 'bash -lc "[ -z \"$ONEAPI_ROOT\" ] && source /opt/intel/oneapi/setvars.sh; meson test -C builddir --no-rebuild --print-errorlogs test_soil_state"', depends-on = ["build-linux"] }
test-unit-drainage = { cmd = 'bash -lc "[ -z \"$ONEAPI_ROOT\" ] && source /opt/intel/oneapi/setvars.sh; meson test -C builddir --no-rebuild --print-errorlogs test_drainage_state"', depends-on = ["build-linux"] }
