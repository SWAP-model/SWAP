[workspace]
authors = ["zawadzkim <zawadzkimat@outlook.com>"]
channels = ["conda-forge"]
name = "swap"
platforms = ["linux-64", "win-64"]
version = "4.2.0"

[activation]
env = { PFUNIT_ROOT = "$PIXI_PROJECT_ROOT/tests/pFUnit/build/install_gfortran/PFUNIT-4.15" }

[dependencies]
python = "3.11.*"
meson = "==1.7"

[pypi-dependencies]
fprettify = ">=0.3.7, <0.4"

#============================================================================
# FEATURES - Modular dependency groups
#============================================================================

# ---- Testing Feature ----
[feature.test.dependencies]
python = "3.11.*"
pytest = ">=8.0"
pytest-xdist = ">=3.5"
pytest-timeout = ">=2.2"
pandas = "<3.0"

[feature.test.pypi-dependencies]
pyswap = ">=0.3.9"

[feature.test.tasks]
# Main regression task with optional arguments
# Usage: 
#   pixi run -e test regression              # runs all cases
#   pixi run -e test regression hupselbrook  # runs single case
#   pixi run -e test regression --log-timing # runs all with timing
regression = { cmd = "python tests/regression/test_output_regression.py", depends-on = ["build-linux"] }

# ---- Documentation Feature ----
[feature.docs.dependencies]
ford = ">=7.0"
python = "3.11.*"

[feature.docs.tasks]
# Generate FORD documentation
# Usage: pixi run -e docs docs-build
docs-build = "ford docs.md"
# Serve documentation locally
# Usage: pixi run -e docs docs-serve
docs-serve = { cmd = "python -m http.server --directory docs/api 8001", depends-on = ["docs-build"] }
# Open documentation in browser (Linux)
# Usage: pixi run -e docs docs-open
docs-open = { cmd = "xdg-open doc/index.html || open doc/index.html", depends-on = ["docs-build"] }
# Clean generated documentation
# Usage: pixi run -e docs docs-clean
docs-clean = "rm -rf doc api-doc"
# Full rebuild: clean and build
# Usage: pixi run -e docs docs-rebuild
docs-rebuild = { depends-on = ["docs-clean", "docs-build"] }

[environments]
default = { solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }


[tasks]
#============================================================================
# BUILD TASKS
#============================================================================

# Production build (no test suite)
_configure-swap = { cmd = "FC=gfortran meson setup builddir --reconfigure -Denable_pfunit=false -Denable_unit_tests=false" }
build-linux     = { cmd = "meson compile -C builddir", depends-on = ["_configure-swap"] }

# Test build (enables unit test targets) — setup + compile are separated
_configure-tests = { cmd = "FC=gfortran meson setup builddir --reconfigure -Denable_pfunit=false -Denable_unit_tests=true" }
_compile-tests   = { cmd = "meson compile -C builddir", depends-on = ["_configure-tests"] }

build-windows-cross = "meson setup builddir_windows --cross-file cross_mingw.txt && meson compile -C builddir_windows"
clean = "rm -rf builddir builddir_windows builddir_windows_native builddir_gfortran"

# gfortran + pFUnit build (separate builddir to avoid compiler conflicts)
_configure-pfunit = { cmd = 'FC=gfortran meson setup builddir_gfortran --reconfigure -Denable_pfunit=true -Denable_unit_tests=true' }
_compile-pfunit   = { cmd = 'meson compile -C builddir_gfortran', depends-on = ["_configure-pfunit"] }

#============================================================================
# RUN TASKS
#============================================================================
swap     = { cmd = "cd tests/swap-cases && ./run_case.sh --exec ../../builddir/swap", depends-on = ["build-linux"] }
swap-win = { cmd = "cd tests/swap-cases && ./run_case.cmd --exec ../../builddir_windows/swap.exe", depends-on = ["build-windows-cross"] }
swap-ref     = { cmd = "cd tests/swap-cases && ./run_case.sh --exec ../../tests/reference/swap420" }
swap-win-ref = { cmd = "cd tests/swap-cases && ./run_case.cmd --exec ../../tests/reference/swap.exe" }

lint = { cmd = "fprettify" }

#============================================================================
# UNIT TEST TASKS
# test-unit     → full suite (daily use)
# test-unit-io  → TOML reader tests only
# _test-unit-*  → per-module (hidden, for focused dev iteration)
#============================================================================
test-unit    = { cmd = "meson test -C builddir --suite unit-standalone --print-errorlogs", depends-on = ["_compile-tests"] }
test-unit-io = { cmd = "meson test -C builddir --suite unit-standalone --print-errorlogs --test-args \"-k toml\"", depends-on = ["_compile-tests"] }
test-pfunit  = { cmd = 'meson test -C builddir_gfortran --suite unit-pfunit --verbose', depends-on = ["_compile-pfunit"] }